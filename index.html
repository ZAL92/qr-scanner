<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام فحص الباركود والتقرير - الدعوات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #121212;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 { color: #c9a24b; margin-bottom: 15px; font-size: 22px; }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      margin-bottom: 15px;
    }

    .result-card {
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .success { background: #1b4332; color: #74c69d; border: 1px solid #2d6a4f; }
    .warning { background: #0c4a6e; color: #38bdf8; border: 1px solid #0284c7; }
    .duplicate { background: #4a0e17; color: #ff8fa3; border: 2px solid #ff4d6d; }

    .btn {
      background: #c9a24b;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-excel { background: #2d6a4f; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #252525;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; }
    th { background: #333; color: #c9a24b; }

    .tag-success { color: #52b788; font-weight: bold; }
    .tag-warning { color: #38bdf8; font-weight: bold; }
    .tag-duplicate { color: #ff4d6d; font-weight: bold; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📷 ماسح بطاقات الدخول</h2>
    
    <div id="reader"></div>
    <div id="resultBox" class="result-card"></div>

    <button id="downloadReportBtn" class="btn btn-excel" onclick="downloadCSVReport()" style="display: none;">
      📥 تحميل تقرير الدخول (Excel / CSV)
    </button>
    <button class="btn" style="background:#444; color:#fff;" onclick="clearReport()">🗑️ مسح التقرير الحالي</button>

    <div style="margin-top:25px; text-align:right;">
      <h3 style="color: #c9a24b; font-size: 16px; margin-bottom: 5px;">📊 سجل الحضور الحالي:</h3>
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>حالة الدخول</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr><td colspan="3" style="color:#777;">لا توجد عمليات دخول حتى الآن</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let scannedLogs = [];
    // الخريطة لتتبع عدد مرات المسح لكل دعوة { 'اسم المدعو': عدد_مرات_الدخول }
    let entryTracker = {}; 
    let html5QrcodeScanner;

    function onScanSuccess(decodedText, decodedResult) {
      // افتراض قراءة الكود والحد الأقصى للضيوف (محددة بـ 2 كحد أقصى)
      let parsedData = parseDecodedData(decodedText);
      let name = parsedData.name;
      let maxAllowed = parsedData.maxAllowed; // 1 أو 2

      let currentTime = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'block';

      // حساب عدد مرات الدخول السابقة
      let currentCount = (entryTracker[name] || 0) + 1;

      if (currentCount <= maxAllowed) {
        entryTracker[name] = currentCount;

        if (currentCount === 1 && maxAllowed === 1) {
          resultBox.className = "result-card success";
          resultBox.innerHTML = `✅ <strong>تم دخول الدعوة بنجاح</strong><br>الاسم: ${name}<br>(دخول شخص واحد)`;
        } else {
          resultBox.className = "result-card warning";
          resultBox.innerHTML = `✅ <strong>تم تسجيل الدخول (${currentCount} من ${maxAllowed})</strong><br>الاسم: ${name}`;
        }

        scannedLogs.push({
          name: name,
          status: `دخول مقبولة (${currentCount}/${maxAllowed})`,
          time: currentTime
        });
      } else {
        // إذا تجاوز العدد المسموح به
        resultBox.className = "result-card duplicate";
        resultBox.innerHTML = `⚠️ <strong>تنبيه: تجاوز الحد المسموح!</strong><br>الاسم: ${name}<br>(تم استنفاذ دخول ${maxAllowed} أشخاص من قبل)`;

        scannedLogs.push({
          name: name,
          status: `⚠️ محاولة دخول مكررة (مكتمل ${maxAllowed}/${maxAllowed})`,
          time: currentTime
        });
      }

      updateReportTable();
      document.getElementById('downloadReportBtn').style.display = 'block';
    }

    function parseDecodedData(text) {
      // تفكيك النص لمعرفة الاسم والعدد
      let parts = text.split('|');
      let name = parts[0] ? parts[0].trim() : text.trim();
      let maxAllowed = parts[1] ? parseInt(parts[1]) : 2; // افتراضي شخصين كحد أقصى
      if (isNaN(maxAllowed) || maxAllowed < 1) maxAllowed = 1;
      if (maxAllowed > 2) maxAllowed = 2; // أقصى حد شخصين

      return { name: name, maxAllowed: maxAllowed };
    }

    function updateReportTable() {
      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = "";

      [...scannedLogs].reverse().forEach(log => {
        let isDup = log.status.includes("مكررة");
        let statusClass = isDup ? "tag-duplicate" : (log.status.includes("1/1") ? "tag-success" : "tag-warning");

        let rowHtml = `
          <tr>
            <td><strong>${log.name}</strong></td>
            <td class="${statusClass}">${log.status}</td>
            <td style="color:#aaa; font-size:12px;">${log.time}</td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      });
    }

    function downloadCSVReport() {
      if (scannedLogs.length === 0) return;

      let csvContent = "\uFEFFالاسم,الحالة,الوقت\n";
      scannedLogs.forEach(log => {
        csvContent += `"${log.name}","${log.status}","${log.time}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `تقرير_دخول_الضيوف.csv`;
      link.click();
    }

    function clearReport() {
      if (confirm("مسح السجل بالكامل؟")) {
        scannedLogs = [];
        entryTracker = {};
        document.getElementById('reportTableBody').innerHTML = `<tr><td colspan="3" style="color:#777;">لا توجد عمليات دخول حتى الآن</td></tr>`;
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('downloadReportBtn').style.display = 'none';
      }
    }

    window.onload = function() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
      html5QrcodeScanner.render(onScanSuccess);
    };
  </script>
</body>
</html>
