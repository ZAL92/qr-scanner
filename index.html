<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام فحص الباركود الذكي - إدارة الدعوات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #181818;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      text-align: center;
      border: 1px solid #2a2a2a;
    }

    h2 { color: #c9a24b; margin-bottom: 15px; font-size: 20px; font-weight: 800; }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: #222;
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    .stat-item { text-align: center; }
    .stat-item .num { font-size: 18px; font-weight: bold; color: #c9a24b; }
    .stat-item .label { font-size: 11px; color: #aaa; }

    #reader-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #333;
      margin-bottom: 15px;
      background: #000;
      transition: border-color 0.3s ease;
    }

    #reader { width: 100%; }
    #reader select, #reader button { display: none !important; }

    .result-card {
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-weight: bold;
      display: none;
      font-size: 15px;
      animation: pulse 0.3s ease-in-out;
    }

    .success { background: #133a27; color: #52b788; border: 2px solid #2d6a4f; }
    .warning { background: #0c3852; color: #38bdf8; border: 2px solid #0284c7; }
    .duplicate { background: #4a0e17; color: #ff8fa3; border: 2px solid #ff4d6d; }

    .btn {
      background: #c9a24b;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.8; }
    .btn-excel { background: #2d6a4f; color: #fff; }
    .btn-upload { background: #1d4ed8; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #222;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #333; font-size: 12px; }
    th { background: #2d2d2d; color: #c9a24b; }

    .tag-success { color: #52b788; font-weight: bold; }
    .tag-warning { color: #38bdf8; font-weight: bold; }
    .tag-duplicate { color: #ff4d6d; font-weight: bold; }

    @keyframes pulse {
      0% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📷 نظام فحص الدخول المباشر</h2>

    <!-- زر رفع ملف الأسماء المطابقة -->
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
    <button class="btn btn-upload" onclick="document.getElementById('csvFileInput').click()">
      📂 رفع كشف الأسماء المطابقة (CSV)
    </button>

    <!-- شريط الإحصائيات -->
    <div class="stats-bar" style="margin-top: 15px;">
      <div class="stat-item">
        <div class="num" id="totalAcceptedCount">0</div>
        <div class="label">إجمالي المقبولين</div>
      </div>
      <div class="stat-item">
        <div class="num" style="color:#ff4d6d;" id="totalRejectedCount">0</div>
        <div class="label">المرفوض / المكرر</div>
      </div>
      <div class="stat-item">
        <div class="num" style="color:#38bdf8;" id="totalScansCount">0</div>
        <div class="label">إجمالي العمليات</div>
      </div>
    </div>
    
    <!-- إطار الكاميرا -->
    <div id="reader-wrapper">
      <div id="reader"></div>
    </div>

    <!-- كارت النتيجة -->
    <div id="resultBox" class="result-card"></div>

    <button id="downloadReportBtn" class="btn btn-excel" onclick="downloadCSVReport()" style="display: none;">
      📥 تحميل تقرير الحضور (Excel / CSV)
    </button>
    <button class="btn" style="background:#333; color:#ccc;" onclick="clearReport()">🗑️ إعادة تصفير السجل</button>

    <div style="margin-top:20px; text-align:right;">
      <h3 style="color: #c9a24b; font-size: 14px; margin-bottom: 5px;">📊 السجل المباشر:</h3>
      <table>
        <thead>
          <tr>
            <th>الاسم المعتمد</th>
            <th>الحالة</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr><td colspan="3" style="color:#666;">في انتظار أول عملية مسح...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let scannedLogs = [];
    let entryTracker = {}; 
    let guestDatabase = {}; // كشف الأسماء المرفوع من الإكسل
    let html5QrCode;

    let acceptedCount = 0;
    let rejectedCount = 0;

    let isProcessing = false; 
    const SCAN_DELAY = 3000;  

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // دالة رفع ملف CSV للأسماء المطابقة
    function handleCSVUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const lines = evt.target.result.split('\n');
        guestDatabase = {}; // تصفير الجدول القديم
        let loadedCount = 0;

        lines.forEach(line => {
          let parts = line.split(',');
          if (parts.length >= 2) {
            let qrCodeKey = parts[0].trim();
            let realName = parts[1].trim();
            if (qrCodeKey && realName) {
              guestDatabase[qrCodeKey] = realName;
              loadedCount++;
            }
          }
        });

        alert(`✅ تم تحميل ${loadedCount} اسم بنجاح من الكشف!`);
      };
      reader.readAsText(file, 'UTF-8');
    }

    function startAutoCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 8, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        console.error("تعذر فتح الكاميرا تلقائياً:", err);
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      let parsedData = parseDecodedData(decodedText);
      let rawId = parsedData.rawId;       // المفتاح الفريد المميز للكود
      let name = parsedData.displayName;   // الاسم المطابق من الكشف أو النص المفكك
      let maxAllowed = parsedData.maxAllowed; 

      let currentTime = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const resultBox = document.getElementById('resultBox');
      const readerWrapper = document.getElementById('reader-wrapper');
      resultBox.style.display = 'block';

      // تتبع الدخول بناءً على الباركود الفريد
      let currentCount = (entryTracker[rawId] || 0) + 1;

      if (currentCount <= maxAllowed) {
        entryTracker[rawId] = currentCount;
        acceptedCount++;
        playSound('success');

        readerWrapper.style.borderColor = "#2d6a4f"; 

        if (maxAllowed === 1) {
          resultBox.className = "result-card success";
          resultBox.innerHTML = `✅ <strong>تم دخول الدعوة بنجاح</strong><br>الاسم: ${name}<br>(دعوة فردية - 1/1)`;
        } else {
          resultBox.className = "result-card warning";
          resultBox.innerHTML = `✅ <strong>تم تسجيل الدخول (${currentCount} من ${maxAllowed})</strong><br>الاسم: ${name}`;
        }

        scannedLogs.push({
          name: name,
          status: `مقبول (${currentCount}/${maxAllowed})`,
          time: currentTime
        });
      } else {
        rejectedCount++;
        playSound('error');

        readerWrapper.style.borderColor = "#ff4d6d"; 

        resultBox.className = "result-card duplicate";
        resultBox.innerHTML = `⚠️ <strong>تنبيه: محاولة دخول مكررة!</strong><br>الاسم: ${name}<br>(تم استنفاذ كامل العدد المسموح: ${maxAllowed}/${maxAllowed})`;

        scannedLogs.push({
          name: name,
          status: `⚠️ مكرر (مكتمل ${maxAllowed}/${maxAllowed})`,
          time: currentTime
        });
      }

      updateReportTable();
      updateStats();
      document.getElementById('downloadReportBtn').style.display = 'block';

      setTimeout(() => {
        readerWrapper.style.borderColor = "#333";
        isProcessing = false;
      }, SCAN_DELAY);
    }

    // --- 🔑 الحل الجذري لتفادي تضارب الباركودات المختلفة ---
    function parseDecodedData(text) {
      let rawText = text.trim();
      let maxAllowed = 1;
      let nameCandidate = rawText;

      // 1. البحث عن أي رقم في النص ليكون هو عدد الضيوف
      let parts = rawText.split(/\||-|,|\n/);
      if (parts.length > 1) {
        nameCandidate = parts[0].trim();
        let lastPart = parts[parts.length - 1];
        let numMatch = lastPart.match(/\d+/);
        if (numMatch) {
          let num = parseInt(numMatch[0], 10);
          if (num > 0) maxAllowed = num;
        }
      } else {
        let match = rawText.match(/(.*?)\s+(\d+)\s*$/);
        if (match) {
          nameCandidate = match[1].trim();
          maxAllowed = parseInt(match[2], 10);
        }
      }

      // تنظيف الاسم من التسميات الزائدة
      nameCandidate = nameCandidate.replace(/^(الاسم|الضيف|اسم المدعو|عدد الضيوف|دعوة)\s*:\s*/i, '').trim();

      // 2. إذا كان هنالك كشف أسماء مرفوع مطبق، نأخذ الاسم الحقيقي منه فوراً
      let finalDisplayName = guestDatabase[rawText] || guestDatabase[nameCandidate] || nameCandidate;

      return {
        rawId: rawText,                // النص الكامل لمنع التضارب بين الباركودات
        displayName: finalDisplayName, // الاسم الذي سيظهر في السجل والتقرير
        maxAllowed: maxAllowed         // عدد الضيوف
      };
    }

    function updateStats() {
      document.getElementById('totalAcceptedCount').innerText = acceptedCount;
      document.getElementById('totalRejectedCount').innerText = rejectedCount;
      document.getElementById('totalScansCount').innerText = scannedLogs.length;
    }

    function updateReportTable() {
      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = "";

      [...scannedLogs].reverse().forEach(log => {
        let isDup = log.status.includes("مكرر");
        let statusClass = isDup ? "tag-duplicate" : (log.status.includes("1/1") ? "tag-success" : "tag-warning");

        let rowHtml = `
          <tr>
            <td><strong>${log.name}</strong></td>
            <td class="${statusClass}">${log.status}</td>
            <td style="color:#aaa; font-size:11px;">${log.time}</td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      });
    }

    function downloadCSVReport() {
      if (scannedLogs.length === 0) return;
      let csvContent = "\uFEFFالاسم المعتمد,الحالة,الوقت\n";
      scannedLogs.forEach(log => { csvContent += `"${log.name}","${log.status}","${log.time}"\n`; });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `تقرير_حضور_الضيوف.csv`;
      link.click();
    }

    function clearReport() {
      if (confirm("هل أنت متأكد من مسح كافة السجلات والإحصائيات؟")) {
        scannedLogs = [];
        entryTracker = {};
        acceptedCount = 0;
        rejectedCount = 0;
        updateStats();
        document.getElementById('reportTableBody').innerHTML = `<tr><td colspan="3" style="color:#666;">في انتظار أول عملية مسح...</td></tr>`;
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('downloadReportBtn').style.display = 'none';
      }
    }

    window.onload = function() { startAutoCamera(); };
  </script>
</body>
</html>
