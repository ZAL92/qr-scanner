<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح بطاقات الدخول - الميعاد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- مكتبة الباركود السريعة -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 { color: #c9a24b; margin-bottom: 5px; font-size: 20px; }
    .cloud-status { font-size: 12px; color: #52b788; margin-bottom: 12px; font-weight: bold; }
    .visitors-counter-card {
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 2px solid #c9a24b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .visitors-title { font-size: 13px; color: #d1d5db; }
    .visitors-count { font-size: 34px; font-weight: 800; color: #c9a24b; line-height: 1.1; }
    #reader {
      width: 100%;
      min-height: 250px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      background: #000;
    }
    .result-card {
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: bold;
      display: none;
    }
    .success { background: #1b4332; color: #74c69d; border: 1px solid #2d6a4f; }
    .warning { background: #0c4a6e; color: #38bdf8; border: 1px solid #0284c7; }
    .duplicate { background: #4a0e17; color: #ff8fa3; border: 2px solid #ff4d6d; }
    .btn {
      background: #c9a24b; color: #000; border: none; padding: 12px;
      border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;
      width: 100%; margin-top: 10px;
    }
    .btn-excel { background: #2d6a4f; color: #fff; }
    .btn-clear { background: #9a031e; color: #fff; }
    table {
      width: 100%; border-collapse: collapse; margin-top: 10px;
      background: #252525; border-radius: 8px; overflow: hidden;
    }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid #333; font-size: 12px; }
    th { background: #333; color: #c9a24b; }
    .tag-success { color: #52b788; font-weight: bold; }
    .tag-warning { color: #38bdf8; font-weight: bold; }
    .tag-duplicate { color: #ff4d6d; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📷 ماسح بطاقات الدخول</h2>
    <div id="cloudStatusText" class="cloud-status">☁️ متصل بالسحابة (مباشر)</div>
    
    <div class="visitors-counter-card">
      <div class="visitors-title">👥 عدد الزوار الداخلين حتى الآن</div>
      <div class="visitors-count" id="totalVisitorsCount">0</div>
    </div>

    <!-- شاشة الكاميرا -->
    <div id="reader"></div>
    <div id="resultBox" class="result-card"></div>

    <button id="downloadReportBtn" class="btn btn-excel" onclick="downloadCSVReport()" style="display: none;">
      📥 تحميل تقرير الدخول (Excel)
    </button>
    <button class="btn btn-clear" onclick="clearReport()">🗑️ مسح سجل الفعالية بالكامل</button>

    <div style="margin-top:20px; text-align:right;">
      <h3 style="color: #c9a24b; font-size: 15px; margin-bottom: 5px;">📊 سجل الحضور المباشر:</h3>
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الحالة</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr><td colspan="3" style="color:#777;">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCQplTFGNLBJKm98arjZgpDNmg66bZAM0",
      authDomain: "almead-7c90d.firebaseapp.com",
      projectId: "almead-7c90d",
      storageBucket: "almead-7c90d.firebasestorage.app",
      messagingSenderId: "560427791112",
      appId: "1:560427791112:web:1335dac89da1f8673cb2bd",
      measurementId: "G-7WLNW3CL57"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let scannedLogs = [];
    let entryTracker = {}; 
    let html5QrCode = null;
    let isProcessing = false;

    // المزامنة مع السحابة
    function listenToCloudDatabase() {
      db.collection("event_scans").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
        scannedLogs = [];
        entryTracker = {};
        let totalAcceptedVisitors = 0;

        snapshot.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id;
          scannedLogs.push(data);

          if (data.isAccepted) {
            entryTracker[data.name] = (entryTracker[data.name] || 0) + 1;
            totalAcceptedVisitors++;
          }
        });

        document.getElementById('totalVisitorsCount').innerText = totalAcceptedVisitors;
        updateReportTable();
        document.getElementById('downloadReportBtn').style.display = scannedLogs.length > 0 ? 'block' : 'none';
      }, (error) => {
        console.error("خطأ في الاتصال بالسحابة:", error);
        document.getElementById('cloudStatusText').innerText = "❌ خطأ بالاتصال بالـ Firebase (افحص الـ Rules)";
        document.getElementById('cloudStatusText').style.color = "#ff4d6d";
      });
    }

    // معالجة المسح المباشر مع حماية من التعليق
    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      try {
        let parsedData = parseDecodedData(decodedText);
        let name = parsedData.name;
        let maxAllowed = parsedData.maxAllowed;

        let currentTime = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        let currentCount = (entryTracker[name] || 0) + 1;
        let isAccepted = false;
        let statusText = "";

        if (currentCount <= maxAllowed) {
          isAccepted = true;
          resultBox.className = "result-card " + (currentCount === 1 && maxAllowed === 1 ? "success" : "warning");
          resultBox.innerHTML = `✅ <strong>تم تسجيل الدخول (${currentCount}/${maxAllowed})</strong><br>الاسم: ${name}`;
          statusText = `دخول مقبولة (${currentCount}/${maxAllowed})`;
        } else {
          resultBox.className = "result-card duplicate";
          resultBox.innerHTML = `⚠️ <strong>تجاوز الحد المسموح!</strong><br>الاسم: ${name}`;
          statusText = `⚠️ محاولة مكررة (${maxAllowed}/${maxAllowed})`;
        }

        // حفظ القراءة في السحابة مع مهلة أقصاها 3 ثوان لمنع التعليق
        const savePromise = db.collection("event_scans").add({
          name: name,
          status: statusText,
          time: currentTime,
          isAccepted: isAccepted,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error("Firebase Timeout")), 3500)
        );

        await Promise.race([savePromise, timeoutPromise]);

      } catch (e) {
        console.warn("تنبيه الحفظ:", e.message);
        if(e.message === "Firebase Timeout") {
          alert("تنبيه: السحابة بطيئة، يرجى التأكد من شبكة الإنترنت أو تفعيل الـ Rules في Firebase.");
        }
      } finally {
        // فك تعليق القارئ بعد 1.2 ثانية فوراً
        setTimeout(() => {
          isProcessing = false;
        }, 1200);
      }
    }

    function parseDecodedData(text) {
      let parts = text.split('|');
      let name = parts[0] ? parts[0].trim() : text.trim();
      let maxAllowed = parts[1] ? parseInt(parts[1], 10) : 1;
      if (isNaN(maxAllowed) || maxAllowed < 1) maxAllowed = 1;
      return { name: name, maxAllowed: maxAllowed };
    }

    function updateReportTable() {
      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = "";

      if (scannedLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="color:#777;">لا توجد سجلات بعد</td></tr>`;
        return;
      }

      [...scannedLogs].reverse().forEach(log => {
        let isDup = log.status.includes("مكررة");
        let statusClass = isDup ? "tag-duplicate" : (log.status.includes("1/1") ? "tag-success" : "tag-warning");

        let rowHtml = `
          <tr>
            <td><strong>${log.name}</strong></td>
            <td class="${statusClass}">${log.status}</td>
            <td style="color:#aaa; font-size:11px;">${log.time || ''}</td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      });
    }

    function downloadCSVReport() {
      if (scannedLogs.length === 0) return;
      let csvContent = "\uFEFFالاسم,الحالة,الوقت\n";
      scannedLogs.forEach(log => {
        csvContent += `"${log.name}","${log.status}","${log.time || ''}"\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `تقرير_الدخول.csv`;
      link.click();
    }

    async function clearReport() {
      if (confirm("هل أنت تأكد من مسح كافة بيانات الدخول وتصفير السجل؟")) {
        try {
          const snapshot = await db.collection("event_scans").get();
          const batch = db.batch();
          snapshot.docs.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          document.getElementById('resultBox').style.display = 'none';
          document.getElementById('totalVisitorsCount').innerText = "0";
          alert("تم المسح والتصفير بنجاح.");
        } catch (e) {
          alert("خطأ أثناء المسح.");
        }
      }
    }

    // تشغيل الكاميرا الخلفية تلقائياً وبشكل مباشر للجوال
    window.onload = function() {
      listenToCloudDatabase();

      html5QrCode = new Html5Qrcode("reader");
      const cameraConfig = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        cameraConfig, 
        onScanSuccess
      ).catch(e => {
        console.error("خطأ تشغيل الكاميرا:", e);
      });
    };
  </script>
</body>
</html>
